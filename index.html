          meta: { ...(parsed.meta || {}), cutoffDate: CUTOFF_DATE, version: 'v35_ZERO_DISCREPANCY_FINAL' }
        };
      } catch (e) {
        return JSON.parse(JSON.stringify(INITIAL_DATA));
      }
    }

    function mahajanStats(mId) {
      const purs = state.purchases.filter(p => mId === 'ALL' || p.mahajanId === mId);
      const pays = state.mahajanPayments.filter(p => mId === 'ALL' || p.mahajanId === mId);
      const opening = state.mahajans
        .filter(m => mId === 'ALL' || m.id === mId)
        .reduce((s, m) => s + Number(m.openingDue || 0), 0);
      const totalBuy = purs.reduce((s, p) => s + Number(p.total || 0), 0);
      const totalPaid = pays.reduce((s, p) => s + Number(p.amount || 0), 0);
      const netDue = opening + totalBuy - totalPaid;
      return { opening, totalBuy, totalPaid, netDue, purs, pays };
    }

    function karigarStats(kId) {
      const list = state.karigars.filter(k => kId === 'ALL' || k.id === kId);
      let opening = 0, liveWage = 0, livePaid = 0, issued = 0, returned = 0;
      for (const k of list) {
        opening += Number(k.openingBalance || 0);
        const logs = state.karigarLogs.filter(l => l.karigarId === k.id);
        for (const l of logs) {
          issued += Number(l.issuedPcs || 0);
          returned += Number(l.returnedPcs || 0);
          if (!l.archived && String(l.date || '') > CUTOFF_DATE) {
            liveWage += Number(l.wage || 0);
            livePaid += Number(l.paid || 0);
          }
        }
      }
      const netBalance = opening + liveWage - livePaid;
      const pendingPcs = issued - returned;
      return { opening, liveWage, livePaid, netBalance, issued, returned, pendingPcs };
    }

    function normSize(val) {
      const s = String(val || '').trim();
      if (s === '38' || /38/.test(s)) return '38';
      if (s === '42' || /42/.test(s)) return '42';
      if (s === '43' || /43/.test(s)) return '43';
      return 'অন্যান্য';
    }

    function productionReconciliationStats() {
      const cutoff = CUTOFF_DATE;
      const mStat = mahajanStats('ALL');
      let cutIssued = 0, cutReturned = 0, sewIssued = 0, sewReturned = 0;
      let cutActiveIssued = 0, cutActiveReturned = 0, sewActiveIssued = 0, sewActiveReturned = 0;
      let preCutoffSewPending = 0;

      const sizes = ['38', '42', '43', 'অন্যান্য'];
      const bySize = {};
      for (const sz of sizes) {
        bySize[sz] = { cutRet: 0, sewIss: 0, sewRet: 0, sold: 0, cutStock: 0, withKarigar: 0, readyStock: 0 };
      }

      const kMap = new Map(state.karigars.map(k => [k.id, k]));
      for (const l of state.karigarLogs) {
        const k = kMap.get(l.karigarId);
        const role = k ? k.role : 'Sewing';
        const iss = Number(l.issuedPcs || 0);
        const ret = Number(l.returnedPcs || 0);
        const sz = normSize(l.size || l.item);
        const isLive = !l.archived && String(l.date || '') > cutoff;

        if (role === 'Cutting') {
          cutIssued += iss;
          cutReturned += ret;
          if (isLive) {
            cutActiveIssued += iss;
            cutActiveReturned += ret;
            bySize[sz].cutRet += ret;
          }
        } else {
          sewIssued += iss;
          sewReturned += ret;
          if (isLive) {
            sewActiveIssued += iss;
            sewActiveReturned += ret;
            bySize[sz].sewIss += iss;
            bySize[sz].sewRet += ret;
          } else if (!l.archived) {
            preCutoffSewPending += (iss - ret);
          }
        }
      }

      let totalSoldPcs = 0;
      for (const s of (state.salesSummary || [])) {
        if (String(s.date || '') <= cutoff) continue;
        const q = Number(s.qty || 0);
        totalSoldPcs += q;
        const sz = normSize(s.size || s.desc);
        bySize[sz].sold += q;
      }

      for (const sz of sizes) {
        const b = bySize[sz];
        b.cutStock = b.cutRet - b.sewIss;
        b.withKarigar = b.sewIss - b.sewRet;
        b.readyStock = b.sewRet - b.sold;
      }

      const fs = state.fabricStock || { beltKg: 80, beltCount: 1, thanCount: 6, thanMeters: 144 };
      return {
        cutoff,
        mahajanNetDue: mStat.netDue,
        fabricBeltCount: Number(fs.beltCount || 0),
        fabricBeltKg: Number(fs.beltKg || 0),
        fabricThanCount: Number(fs.thanCount || 0),
        fabricThanMeters: Number(fs.thanMeters || 0),
        cutIssued, cutReturned, cutPending: cutIssued - cutReturned,
        sewIssued, sewReturned, sewPending: sewIssued - sewReturned,
        preCutoffSewPending,
        cutActiveIssued, cutActiveReturned,
        sewActiveIssued, sewActiveReturned,
        totalSoldPcs,
        readyStockActive: sewActiveReturned - totalSoldPcs,
        bySize
      };
    }

    function calcSackBatch(sb) {
      const sackKg = Math.max(0, Number(sb.sackKg || 0));
      const ratePerKg = Math.max(0, Number(sb.ratePerKg || 0));
      const sackTotalCost = sackKg * ratePerKg;
      const pcs38 = Math.max(0, Number(sb.pcs38 || 0));
      const pcs42 = Math.max(0, Number(sb.pcs42 || 0));
      const totalPcs = pcs38 + pcs42;
      const kgPerPc38 = Math.max(0, Number(sb.kgPerPc38 || 0));
      const kgPerPc42 = Math.max(0, Number(sb.kgPerPc42 || 0));
      const usedKgTotal = (pcs38 * kgPerPc38) + (pcs42 * kgPerPc42);
      const leftoverOrDiffKg = sackKg - usedKgTotal;
      const labourPerDozen = Number(sb.cuttingPerDozen || 0) + Number(sb.sewingPerDozen || 0) + Number(sb.threadPerDozen || 0) + Number(sb.extraPerDozen || 0);
      const labourPerPc = labourPerDozen / 12;
      const fabricPc38 = kgPerPc38 * ratePerKg;
      const costPc38 = fabricPc38 + labourPerPc;
      const costDozen38 = costPc38 * 12;
      const profitPc38 = Number(sb.sell38 || 0) - costPc38;
      const profitDozen38 = profitPc38 * 12;
      const fabricPc42 = kgPerPc42 * ratePerKg;
      const costPc42 = fabricPc42 + labourPerPc;
      const costDozen42 = costPc42 * 12;
      const profitPc42 = Number(sb.sell42 || 0) - costPc42;
      const profitDozen42 = profitPc42 * 12;
      const batchTotalCost = (pcs38 * costPc38) + (pcs42 * costPc42);
      const batchTotalSell = (pcs38 * Number(sb.sell38 || 0)) + (pcs42 * Number(sb.sell42 || 0));
      const batchNetProfit = batchTotalSell - batchTotalCost;
      return {
        sackTotalCost, totalPcs, usedKgTotal, leftoverOrDiffKg, labourPerPc,
        fabricPc38, costPc38, costDozen38, profitPc38, profitDozen38,
        fabricPc42, costPc42, costDozen42, profitPc42, profitDozen42,
        batchTotalCost, batchTotalSell, batchNetProfit
      };
    }

        });
      } else {

          status: 'OK',
          title: `নতুন কাটিং ও সেলাই অডিট ঠিক আছে (> 21/11/2026)`,

        });
      }
      if (state.khataAuditBaseline.lastUploadedAudit) {
        const up = state.khataAuditBaseline.lastUploadedAudit;
        checks.unshift({ status: up.diffFound ? 'ALERT' : 'OK', title: `আপলোড করা খাতাবুক রিপোর্ট অডিট (${up.fileName})`, detail: up.summary });
        if (up.diffFound) errorCount++;
      }
      return { checks, errorCount };
    }

    async function handleKhataBookFile(file) {
      if (!file) return;
      toast('খাতাবুক ফাইল পড়া হচ্ছে...');
      let extractedText = '';
      try {
        if (file.name.toLowerCase().endsWith('.pdf') && typeof pdfjsLib !== 'undefined') {
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          const buf = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const tc = await page.getTextContent();
            extractedText += tc.items.map(it => it.str).join(' ') + '\n';
          }
        } else {
          extractedText = await file.text();
        }
        analyzeKhataBookText(extractedText, file.name);
      } catch (err) {

    function analyzeKhataBookText(text, sourceName = 'Pasted KhataBook Data') {
      const clean = String(text || '').replace(/\s+/g, ' ');
      if (clean.length < 15) {
        toast('ফাইলে কোনো লেখা পাওয়া যায়নি।');
        return;
      }
      const findings = [];
      let diffFound = false;
      const gayatri = mahajanStats('MAH_GAYATRI');
      if (/gayatri/i.test(clean)) {
        const nums = [...clean.matchAll(/₹?\s*([0-9]{1,3}(?:,[0-9]{2,3})*(?:\.[0-9]{1,2})?)/g)]
          .map(m => parseFloat(m[1].replace(/,/g, '')))
          .filter(n => !isNaN(n) && n > 500);
        const matchedDue = nums.find(n => Math.abs(n - gayatri.netDue) < 10);
        if (matchedDue !== undefined) findings.push(`গায়ত্রী টেক্সটাইল বকেয়া ₹${matchedDue} অ্যাপের (${money(gayatri.netDue)}) সাথে মিলেছে।`);
        else if (nums.length) {
          diffFound = true;
          findings.push(`খাতাবুক ফাইলে গায়ত্রী টেক্সটাইলের অঙ্ক (${nums.slice(0,4).map(money).join(', ')}) অ্যাপের বকেয়া (${money(gayatri.netDue)}) থেকে আলাদা।`);
        }
      }
      for (const k of state.karigars) {
        const shortName = k.name.split('(')[0].trim();
        const re = new RegExp(shortName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
        if (re.test(clean)) {
          const st = karigarStats(k.id);
          findings.push(`${shortName} পাওয়া গেছে (অ্যাপের নিট ব্যালেন্স: ${money(st.netBalance)})।`);
        }
      }
      if (findings.length === 0) findings.push(`ফাইলটি পড়া হয়েছে (${clean.length} অক্ষর)।`);
      state.khataAuditBaseline.lastUploadedAudit = { fileName: sourceName, checkedAt: new Date().toLocaleString('en-IN'), diffFound, summary: findings.join(' ') };
      saveState(); render(); toast('খাতাবুক অডিট সম্পন্ন হয়েছে!');
    }

    function getCloudCfg() {
      try { return JSON.parse(localStorage.getItem(CLOUD_KEY) || '{}'); } catch (e) { return {}; }
    }
    function cloudUrl(cfg) {
      const base = String(cfg.url || '').trim().replace(/\/+$/, '');
      const pin = String(cfg.pin || '').trim().replace(/[.$#\[\]\/\s]+/g, '_') || 'default';
      return `${base}/tanisha_dresses/${encodeURIComponent(pin)}/factory_audit_data_v5.json`;
    }
    function setBadge(txt) {
      const el = document.getElementById('syncBadge');
      if (el) el.textContent = txt;
    }
    function scheduleCloudSync() {
      const cfg = getCloudCfg();
      if (!cfg.url || !cfg.pin) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => syncWithFirebase(true), 1200);
    }
    async function syncWithFirebase(silent = false) {
      const cfg = getCloudCfg();
      if (!cfg.url || !cfg.pin) {
        setBadge('● অফলাইন সেভ');
        if (!silent) toast('প্রথমে Firebase URL এবং Sync PIN সেভ করুন।');
        return;
      }
      if (!navigator.onLine) {
        setBadge('● অফলাইন (অপেক্ষমাণ)');
        return;
      }
      setBadge('↻ সিঙ্ক হচ্ছে...');
      try {
        const ep = cloudUrl(cfg);
        const res = await fetch(ep + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const remote = await res.json();
        if (remote && remote.data && remote.updatedAt) {
          const rTime = Date.parse(remote.updatedAt) || 0;
          const lTime = Date.parse(state.meta?.updatedAt) || 0;
          if (rTime > lTime + 1500) {
            state = { ...JSON.parse(JSON.stringify(INITIAL_DATA)), ...remote.data };
            saveState(true); render();
          }
        }
        const put = await fetch(ep, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: state, updatedAt: state.meta.updatedAt })
        });
        if (!put.ok) throw new Error('Save HTTP ' + put.status);
        setBadge('● সিঙ্ক চালু আছে');
        if (!silent) toast('সব ফোনের সাথে ডেটা সিঙ্ক হয়েছে!');
      } catch (e) {
        setBadge('● অফলাইন সেভ');
        if (!silent) toast('সিঙ্ক এরর: ' + e.message);
      }
    }

    function getAutoCostBreakdown() {
      const totalPurchaseCost = (state.purchases || []).reduce((s, p) => s + Number(p.total || 0), 0);
      const totalKarigarWage = (state.karigarLogs || []).reduce((s, l) => s + Number(l.wage || 0), 0);
      const totalOtherExpense = (state.expenses || []).reduce((s, e) => s + Number(e.amount || 0), 0);

      // Breakdown of loading/unloading, transport, thread if mentioned in expenses
      let loadingCost = 0, transportCost = 0, threadCost = 0, miscExpense = 0;
      for (const e of (state.expenses || [])) {
        const txt = `${e.category || ''} ${e.desc || ''}`.toLowerCase();
        const amt = Number(e.amount || 0);
        if (/load|unload|লোড|আনলোড|কুলি/i.test(txt)) loadingCost += amt;
        else if (/transport|ভাড়া|গাড়ি|ডেলিভারি|delivery/i.test(txt)) transportCost += amt;
        else if (/thread|সুতো/i.test(txt)) threadCost += amt;
        else miscExpense += amt;
      }

      const grandTotalCost = totalPurchaseCost + totalKarigarWage + totalOtherExpense;
      const profit5Amt = grandTotalCost * 0.05;
      const sellPrice5Pct = grandTotalCost + profit5Amt;
      const profit10Amt = grandTotalCost * 0.10;
      const sellPrice10Pct = grandTotalCost + profit10Amt;

      const totalPcs = (state.karigarLogs || []).reduce((s, l) => s + Number(l.returnedPcs || 0), 0);
      const costPerPc = totalPcs > 0 ? (grandTotalCost / totalPcs) : 0;
      const sell5PerPc = costPerPc * 1.05;
      const sell10PerPc = costPerPc * 1.10;

      return {
        totalPurchaseCost,
        totalKarigarWage,
        totalOtherExpense,
        loadingCost,
        transportCost,
        threadCost,
        miscExpense,
        grandTotalCost,
        profit5Amt,
        sellPrice5Pct,
        profit10Amt,
        sellPrice10Pct,
        totalPcs,
        costPerPc,
        sell5PerPc,
        sell10PerPc
      };
    }

    function getFullAutoProductionCostEngine() {
      const rule = state.sewingRule || { reelsPerDozen: 1, ratePerReel: 7 };
      const reelsPerDozen = Math.max(0, Number(rule.reelsPerDozen ?? 1));
      const ratePerReel = Math.max(0, Number(rule.ratePerReel ?? 7));

      const batches = state.fabricBatches || [];
      const totalPurchaseBillAmt = batches.reduce((s, b) => s + Number(b.totalCost || 0), 0);
      const totalFabricKg = batches.reduce((s, b) => s + Number(b.kg || 0), 0);
      const totalFabricMeters = batches.reduce((s, b) => s + Number(b.meters || 0), 0);
      const totalFabricThan = batches.reduce((s, b) => s + Number(b.thans || 0), 0);

      const kMap = new Map((state.karigars || []).map(k => [k.id, k]));
      let cutIssuedPcs = 0, cutReturnedPcs = 0, cutWageAutoTotal = 0;
      let sewIssuedPcs = 0, sewReturnedPcs = 0, sewWageAutoTotal = 0;

      for (const l of (state.karigarLogs || [])) {
        if (l.archived || String(l.date || '') <= CUTOFF_DATE) continue;
        const k = kMap.get(l.karigarId);
        const role = k ? k.role : 'Sewing';
        const iss = Number(l.issuedPcs || 0);
        const ret = Number(l.returnedPcs || 0);
        const rateDoz = Number(l.ratePerDozen ?? (k ? k.ratePerDozen : 36));
        const calcWage = ret > 0 ? ((ret / 12) * rateDoz) : Number(l.wage || 0);

        if (role === 'Cutting') {
          cutIssuedPcs += iss;
          cutReturnedPcs += ret;
          cutWageAutoTotal += calcWage;
        } else {
          sewIssuedPcs += iss;
          sewReturnedPcs += ret;
          sewWageAutoTotal += calcWage;
        }
      }

      const sewnDozens = sewReturnedPcs / 12;
      const autoThreadReels = sewnDozens * reelsPerDozen;
      const autoThreadCost = autoThreadReels * ratePerReel;

      const otherExpensesTotal = (state.expenses || []).filter(e => String(e.date || '') > CUTOFF_DATE).reduce((s, e) => s + Number(e.amount || 0), 0);

      // Grand total auto cost = Purchase bills + Auto cutting wage + Auto sewing wage + Auto thread cost + Other expenses
      const totalWageAuto = cutWageAutoTotal + sewWageAutoTotal;
      const grandTotalCost = totalPurchaseBillAmt + totalWageAuto + autoThreadCost + otherExpensesTotal;

      // 5% and 10% profit auto calculation
      const profit5Amt = grandTotalCost * 0.05;
      const sell5Total = grandTotalCost + profit5Amt;
      const profit10Amt = grandTotalCost * 0.10;
      const sell10Total = grandTotalCost + profit10Amt;

      const basePcsForUnit = sewReturnedPcs > 0 ? sewReturnedPcs : cutReturnedPcs;
      const costPerPc = basePcsForUnit > 0 ? (grandTotalCost / basePcsForUnit) : 0;
      const sell5PerPc = costPerPc * 1.05;
      const sell10PerPc = costPerPc * 1.10;

      return {
        reelsPerDozen,
        ratePerReel,
        totalPurchaseBillAmt,
        totalFabricKg,
        totalFabricMeters,
        totalFabricThan,
        cutIssuedPcs,
        cutReturnedPcs,
        cutPendingPcs: cutIssuedPcs - cutReturnedPcs,
        cutWageAutoTotal,
        sewIssuedPcs,
        sewReturnedPcs,
        sewPendingPcs: sewIssuedPcs - sewReturnedPcs,
        sewnDozens,
        sewWageAutoTotal,
        autoThreadReels,
        autoThreadCost,
        totalWageAuto,
        otherExpensesTotal,
        grandTotalCost,
        profit5Amt,
        sell5Total,
        profit10Amt,
        sell10Total,
        basePcsForUnit,
        costPerPc,
        sell5PerPc,
        sell10PerPc
      };
    }

    function calcBale5QualitySplit(bs) {
      const convPc = getConversionCostDz(state.wageHikeExtraDz || 0) / 12;
      const baleKg = Math.max(0.01, Number(bs.baleKg || 80));
      const baleCost = Number(bs.baleTotalCost || 39110);
      const effKgRate = baleCost / baleKg;
      const kg38 = Number(bs.kgPerPc38 || 0.18);
      const kg42 = Number(bs.kgPerPc42 || 0.20);
      const cost38 = (kg38 * effKgRate) + convPc;
      const cost42 = (kg42 * effKgRate) + convPc;

      const qMaster = state.qualityCostMaster || [];
      const p1 = Number(qMaster[0]?.sellPrice ?? 134.15);
      const p2 = Number(qMaster[1]?.sellPrice ?? 124.25);
      const p3 = Number(qMaster[2]?.sellPrice ?? 115.00);
      const p4 = Number(qMaster[3]?.sellPrice ?? 115.00);
      const p5 = Number(qMaster[4]?.sellPrice ?? 110.00);

      const q1 = Math.max(0, Number(bs.q_sd42 || 0));
      const q2 = Math.max(0, Number(bs.q_p78_42 || 0));
      const q3 = Math.max(0, Number(bs.q_p78_38 || 0));
      const q4 = Math.max(0, Number(bs.q_p70_42 || 0));
      const q5 = Math.max(0, Number(bs.q_p70_38 || 0));

      const total42 = q1 + q2 + q4;
      const total38 = q3 + q5;
      const totalPcs = total42 + total38;
      const usedKg = (total42 * kg42) + (total38 * kg38);
      const diffKg = baleKg - usedKg;
      const totalProdCost = (total42 * cost42) + (total38 * cost38);
      const totalSellVal = (q1 * p1) + (q2 * p2) + (q3 * p3) + (q4 * p4) + (q5 * p5);
      const netProfit = totalSellVal - totalProdCost;
      const markupPct = totalProdCost > 0 ? (netProfit / totalProdCost * 100) : 0;

      return { effKgRate, cost38, cost42, total42, total38, totalPcs, usedKg, diffKg, totalProdCost, totalSellVal, netProfit, markupPct };
    }

    function getZeroDiscrepancyReport() {
      const hike = Number(state.wageHikeExtraDz || 0);
      const convDz = getConversionCostDz(hike);
      const convPc = convDz / 12;

      // 1. Check every quality in qualityCostMaster for loss or low margin (< 5%)
      const qList = state.qualityCostMaster || [];
      const qualityAlerts = [];
      let totalTargetValue8Pct = 0;
      let totalTargetCost = 0;

      for (const q of qList) {
        const fabPc = Number(q.stdFabricRateM || 0) * Number(q.metersPerPc || 2);
        const totPc = fabPc + convPc;
        const sellPc = Number(q.sellPrice || 0);
        const profPc = sellPc - totPc;
        const profDz = profPc * 12;
        const markupPct = totPc > 0 ? (profPc / totPc * 100) : 0;

        const qty = Number(q.kbOpeningQty || 0);
        const cVal = Number(q.kbOpeningCostVal || 0);
        totalTargetCost += cVal;
        totalTargetValue8Pct += (cVal * 1.08);

        if (profPc < 0) {
          qualityAlerts.push({
            level: 'ERR',
            title: `লস হচ্ছে: ${q.name} (খরচ ${money(totPc)} বনাম বিক্রি ${money(sellPc)} → প্রতি পিসে ${money(profPc)} লস)`
          });
        } else if (markupPct < 5.0) {
          qualityAlerts.push({
            level: 'WARN',
            title: `মার্জিন 5%-এর নিচে: ${q.name} (লাভ ${markupPct.toFixed(1)}% / ${money(profDz)}/ডজন · 8% লাভে সঠিক দর হওয়া উচিত ${money(totPc * 1.08)}/পিস)`
          });
        }
      }

      // 2. Check missing pieces across karigars (issued - returned)
      const missingKarigars = [];
      for (const k of (state.karigars || [])) {
        const ks = karigarStats(k.id);
        if (ks.pendingPcs > 0) {
          missingKarigars.push({
            name: k.name,
            pendingPcs: ks.pendingPcs,
            wageEst: (ks.pendingPcs / 12) * Number(k.ratePerDozen || 36)
          });
        }
      }

      // 3. Check raw cloth vs finished stock separation (V. GOLD 4 thans + 16/11 2 thans + 80kg bale)
      const batches = state.fabricBatches || [];
      const rawTotal = batches.reduce((s, b) => s + Number(b.totalCost || 0), 0);

      // 4. Check monthly Khatabook audit alignment
      const audits = state.monthlyKhatabookAudits || [];
      const latestAudit = audits[audits.length - 1] || { openingReadyPcs: 602, kbNewStockAdded: 0, kbSoldPcs: 0, kbClosingReadyPcs: 602, kbSalesRevenue: 0, kbSoldCogs: 0 };
      const rec = productionReconciliationStats();
      const expectedClosing = Number(latestAudit.openingReadyPcs || 602) + Number(latestAudit.kbNewStockAdded || 0) - Number(latestAudit.kbSoldPcs || 0);
      const closingGap = Number(latestAudit.kbClosingReadyPcs || 0) - expectedClosing;
      const handoverGap = rec.sewActiveReturned - Number(latestAudit.kbNewStockAdded || 0);

      return {
        convDz,
        convPc,
        qualityAlerts,
        missingKarigars,
        rawTotal,
        closingGap,
        handoverGap,
        totalTargetCost,
        totalTargetValue8Pct,
        fair8PctGain: totalTargetValue8Pct - totalTargetCost
      };
    }

      else if (activeTab === 'mahajans') app.innerHTML = renderMahajans();
      else if (activeTab === 'karigars') app.innerHTML = renderKarigars();
      else if (activeTab === 'costing') app.innerHTML = renderCosting();
      else if (activeTab === 'dhupkathi') app.innerHTML = renderDhupkathi();
      else if (activeTab === 'audit') app.innerHTML = renderAudit();
      else if (activeTab === 'sync') app.innerHTML = renderSync();
    }

    render();
    syncWithFirebase(true);
  })();
  </script>
