        };
        if (applyOpeningZeroMigration(merged)) {

        return merged;

      const totalBuy = purs.reduce((s, p) => s + Number(p.total || 0), 0);
      const totalPaid = pays.reduce((s, p) => s + Number(p.amount || 0), 0);
      const netDue = opening + totalBuy - totalPaid;

    function karigarStats(kId) {
      const list = state.karigars.filter(k => kId === 'ALL' || k.id === kId);
      let opening = 0, liveWage = 0, livePaid = 0, issued = 0, returned = 0;
      for (const k of list) {
        opening += Number(k.openingBalance || 0);
        const logs = state.karigarLogs.filter(l => l.karigarId === k.id);
        for (const l of logs) {
          issued += Number(l.issuedPcs || 0);
          returned += Number(l.returnedPcs || 0);
          if (!l.archived) {
            liveWage += Number(l.wage || 0);
            livePaid += Number(l.paid || 0);
          }
        }
      }
      const netBalance = opening + liveWage - livePaid;
      const pendingPcs = issued - returned;
      return { opening, liveWage, livePaid, netBalance, issued, returned, pendingPcs };
    }

    function normSize(val) {
      const s = String(val || '').trim();
      if (s === '38' || /38/.test(s)) return '38';
      if (s === '42' || /42/.test(s)) return '42';
      if (s === '43' || /43/.test(s)) return '43';
      return 'অন্যান্য';
    }

    function productionReconciliationStats() {
      const mStat = mahajanStats('ALL');
      const totalPurBills = state.purchases.length;
      const totalPurQty = state.purchases.reduce((s, p) => s + Number(p.qty || 0), 0);
      const totalThanCount = state.purchases.reduce((s, p) => s + Number(p.thanCount || 0), 0);
      const totalMeters = state.purchases.reduce((s, p) => s + Number(p.meters || 0), 0);

      let cutIssued = 0, cutReturned = 0, sewIssued = 0, sewReturned = 0;
      let cutActiveIssued = 0, cutActiveReturned = 0, sewActiveIssued = 0, sewActiveReturned = 0;

      const sizes = ['38', '42', '43', 'অন্যান্য'];
      const bySize = {};
      for (const sz of sizes) {
        bySize[sz] = { cutRet: 0, sewIss: 0, sewRet: 0, sold: 0, cutStock: 0, withKarigar: 0, readyStock: 0 };
      }

      const kMap = new Map(state.karigars.map(k => [k.id, k]));
      for (const l of state.karigarLogs) {
        const k = kMap.get(l.karigarId);
        const role = k ? k.role : 'Sewing';
        const iss = Number(l.issuedPcs || 0);
        const ret = Number(l.returnedPcs || 0);
        const sz = normSize(l.size || l.item);
        if (role === 'Cutting') {
          cutIssued += iss;
          cutReturned += ret;
          if (!l.archived) {
            cutActiveIssued += iss;
            cutActiveReturned += ret;
            bySize[sz].cutRet += ret;
          }
        } else {
          sewIssued += iss;
          sewReturned += ret;
          if (!l.archived) {
            sewActiveIssued += iss;
            sewActiveReturned += ret;
            bySize[sz].sewIss += iss;
            bySize[sz].sewRet += ret;
          }
        }
      }

      let totalSoldPcs = 0;
      for (const s of (state.salesSummary || [])) {
        const q = Number(s.qty || 0);
        totalSoldPcs += q;
        const sz = normSize(s.size || s.desc);
        bySize[sz].sold += q;
      }

      for (const sz of sizes) {
        const b = bySize[sz];
        b.cutStock = b.cutRet - b.sewIss;
        b.withKarigar = b.sewIss - b.sewRet;
        b.readyStock = b.sewRet - b.sold;
      }

      return {
        totalPurBills,
        totalPurQty,
        totalThanCount,
        totalMeters,
        totalPurAmt: mStat.totalBuy,
        cutIssued, cutReturned, cutPending: cutIssued - cutReturned,
        sewIssued, sewReturned, sewPending: sewIssued - sewReturned,
        cutActiveIssued, cutActiveReturned,
        sewActiveIssued, sewActiveReturned,
        totalSoldPcs,
        readyStockActive: sewActiveReturned - totalSoldPcs,
        uncutOrWaitSew: cutReturned - sewIssued,
        activeWaitSew: cutActiveReturned - sewActiveIssued,
        bySize
      };
    }

        function calcCostModel(m) {
      const thanCost = Number(m.thanMeters || 0) * Number(m.fabricRatePerMeter || 0);
      const pcs = Math.max(1, Number(m.pcsPerThan || 12));
      const fabricPerPc = thanCost / pcs;
      const labourPerDozen = Number(m.cuttingPerDozen || 0) + Number(m.sewingPerDozen || 0) + Number(m.threadPerDozen || 0) + Number(m.extraPerDozen || 0);
      const labourPerPc = labourPerDozen / 12;
      const totalCostPerPc = fabricPerPc + labourPerPc;
      const totalCostPerDozen = totalCostPerPc * 12;
      const sellPc = Number(m.sellingPricePerPc || 0);
      const profitPerPc = sellPc - totalCostPerPc;
      const profitPerDozen = profitPerPc * 12;
      const marginPct = sellPc > 0 ? (profitPerPc / sellPc) * 100 : 0;
      return { thanCost, fabricPerPc, labourPerDozen, labourPerPc, totalCostPerPc, totalCostPerDozen, profitPerPc, profitPerDozen, marginPct };
    }

    function calcSackBatch(sb) {
      const sackKg = Math.max(0, Number(sb.sackKg || 0));
      const ratePerKg = Math.max(0, Number(sb.ratePerKg || 0));
      const sackTotalCost = sackKg * ratePerKg;

      const pcs38 = Math.max(0, Number(sb.pcs38 || 0));
      const pcs42 = Math.max(0, Number(sb.pcs42 || 0));
      const totalPcs = pcs38 + pcs42;

      const kgPerPc38 = Math.max(0, Number(sb.kgPerPc38 || 0));
      const kgPerPc42 = Math.max(0, Number(sb.kgPerPc42 || 0));

      const usedKg38 = pcs38 * kgPerPc38;
      const usedKg42 = pcs42 * kgPerPc42;
      const usedKgTotal = usedKg38 + usedKg42;
      const leftoverOrDiffKg = sackKg - usedKgTotal;

      const labourPerDozen = Number(sb.cuttingPerDozen || 0) + Number(sb.sewingPerDozen || 0) + Number(sb.threadPerDozen || 0) + Number(sb.extraPerDozen || 0);
      const labourPerPc = labourPerDozen / 12;

      const fabricPc38 = kgPerPc38 * ratePerKg;
      const costPc38 = fabricPc38 + labourPerPc;
      const costDozen38 = costPc38 * 12;
      const sell38 = Number(sb.sell38 || 0);
      const profitPc38 = sell38 - costPc38;
      const profitDozen38 = profitPc38 * 12;

      const fabricPc42 = kgPerPc42 * ratePerKg;
      const costPc42 = fabricPc42 + labourPerPc;
      const costDozen42 = costPc42 * 12;
      const sell42 = Number(sb.sell42 || 0);
      const profitPc42 = sell42 - costPc42;
      const profitDozen42 = profitPc42 * 12;

      const batchTotalCost = (pcs38 * costPc38) + (pcs42 * costPc42);
      const batchTotalSell = (pcs38 * sell38) + (pcs42 * sell42);
      const batchNetProfit = batchTotalSell - batchTotalCost;

      return {
        sackTotalCost, totalPcs, usedKg38, usedKg42, usedKgTotal, leftoverOrDiffKg,
        labourPerDozen, labourPerPc,
        fabricPc38, costPc38, costDozen38, profitPc38, profitDozen38,
        fabricPc42, costPc42, costDozen42, profitPc42, profitDozen42,
        batchTotalCost, batchTotalSell, batchNetProfit
      };
    }

    function runSmartAudit() {
      const checks = [];
      let errorCount = 0;

      const gayatri = mahajanStats('MAH_GAYATRI');
      const rawDiff = gayatri.totalBuy - gayatri.totalPaid;
      checks.push({
        status: 'WARN',
        title: `গায়ত্রী টেক্সটাইল অডিট: মোট ক্রয় ${money(gayatri.totalBuy)} − জমা ${money(gayatri.totalPaid)} = ${money(rawDiff)}, কিন্তু অ্যাপ ব্যালেন্স ${money(gayatri.netDue)}`,
        detail: `১৯-নভেম্বর ২০২৬ মাস্টার তালিকায় ₹30,866.00 ওপেনিং ক্রেডিট/সমন্বয় ধরা আছে, তাই নিট বকেয়া ₹41,702.00 দেখাচ্ছে। খাতার সাথে এই ₹30,866.00 (এবং ১২-এপ্রিলের ₹8,096 বনাম ₹8,090-এর ₹6) মিলিয়ে নেওয়া প্রয়োজন।`
      });
      errorCount++;

      const revList = state.legacyReviewNames || [];
      if (revList.length > 0) {
        checks.push({
          status: 'WARN',
          title: `পৃথক রাখা ৩টি নাম যাচাই বাকি (Legacy Review)`,
          detail: revList.map(r => `${r.name}: ${r.note}`).join(' | ')
        });
      }

      const shampa = karigarStats('WRK_SHAMPA_DUTTA');
      checks.push({
        status: shampa.netBalance === 1845 ? 'OK' : 'WARN',
        title: 'খাতাবুক কারিগর প্রদেয় (Karigar Payable) যাচাই',
        detail: `শম্পা দত্তের প্রদেয় ব্যালেন্স ${money(shampa.netBalance)} (ড্যাশবোর্ড Karigar Payable ₹1,845.00-এর সাথে হুবহু মিলেছে)।`
      });

      const pendingKarigars = state.karigars
        .map(k => ({ name: k.name, pending: karigarStats(k.id).pendingPcs }))
        .filter(x => x.pending !== 0);
      if (pendingKarigars.length > 0) {
        checks.push({
          status: 'WARN',
          title: 'কারিগরদের কাছে জমা বাকি থাকা পিস',
          detail: pendingKarigars.map(x => `${x.name}: ${x.pending} pcs বাকি`).join(' | ')
        });
      } else {
        checks.push({
          status: 'OK',
          title: 'কারিগরদের কাপড় জমা-খরচ পিস সমান আছে',
          detail: 'কোনো কারিগরের কাছে কাটা বা সেলাইয়ের পিস আটকে নেই।'
        });
      }

      const seen = new Map();
      const dups = [];
      for (const p of state.mahajanPayments) {
        const key = `MP|${p.date}|${p.mahajanId}|${p.amount}`;
        if (seen.has(key)) dups.push(`মহাজন পেমেন্ট ডবল এন্ট্রি: ${p.date} তারিখে ${money(p.amount)}`);
        seen.set(key, true);
      }
      for (const l of state.karigarLogs) {
        if (l.archived) continue;
        const key = `KL|${l.date}|${l.karigarId}|${l.returnedPcs}|${l.paid}`;
        if (seen.has(key)) dups.push(`কারিগর এন্ট্রি ডবল: ${l.date} তারিখে ${l.returnedPcs} pcs / ${money(l.paid)}`);
        seen.set(key, true);
      }
      if (dups.length > 0) {
        errorCount += dups.length;
        checks.push({ status: 'ALERT', title: `ডবল এন্ট্রি সতর্কতা (${dups.length}টি)`, detail: dups.join(' ; ') });
      } else {
        checks.push({ status: 'OK', title: 'কোনো ডবল এন্ট্রি পাওয়া যায়নি', detail: 'সমস্ত তারিখ ও টাকার অঙ্ক পরীক্ষা করা হয়েছে।' });
      }

      const invMis = state.khataAuditBaseline.knownInvoiceMismatches;
      checks.push({
        status: 'WARN',
        title: `খাতাবুক পুরোনো বিলের যোগফল অডিট (${invMis.length}টি অমিল নথিভুক্ত)`,
        detail: invMis.map(x => `বিল #${x.inv} (${x.party}, ${x.date}): বিল ₹${x.billTotal} বনাম আইটেম ₹${x.itemTotal} (পার্থক্য ₹${x.diff})`).join(' | ')
      });

      const rec = productionReconciliationStats();
      if (rec.sewActiveIssued > rec.cutActiveReturned && rec.sewActiveIssued > 0) {
        errorCount++;
        checks.push({
          status: 'ALERT',
          title: `কাটিং বনাম সেলাই গরমিল: কাটিং হয়েছে ${rec.cutActiveReturned} pcs, কিন্তু সেলাইয়ে দেওয়া হয়েছে ${rec.sewActiveIssued} pcs`,
          detail: `কাটিং এন্ট্রির চেয়ে ${rec.sewActiveIssued - rec.cutActiveReturned} পিস বেশি সেলাইয়ে দেওয়া হয়েছে—কাটিং মাস্টারের এন্ট্রি বাকি আছে কি না যাচাই করুন।`
        });
      } else {
        checks.push({
          status: 'OK',
          title: 'কাটিং বনাম সেলাই পিস অডিট ঠিক আছে',
          detail: `নতুন কাটিং ${rec.cutActiveReturned} pcs · সেলাইয়ে দেওয়া ${rec.sewActiveIssued} pcs · সেলাই রেডি ${rec.sewActiveReturned} pcs।`
        });
      }

      if (rec.readyStockActive < 0) {
        errorCount++;
        checks.push({
          status: 'ALERT',
          title: `স্টক ও বিক্রি গরমিল: সেলাই রেডি ${rec.sewActiveReturned} pcs, কিন্তু বিক্রি এন্ট্রি হয়েছে ${rec.totalSoldPcs} pcs`,
          detail: `রেডি স্টকের চেয়ে ${Math.abs(rec.readyStockActive)} পিস বেশি বিক্রি দেখানো হয়েছে—সেলাই জমা বা পুরনো স্টক এন্ট্রি মিলিয়ে নিন।`
        });
      } else {
        checks.push({
          status: 'OK',
          title: `স্টক ও বিক্রি অডিট ঠিক আছে (দোকানে রেডি স্টক: ${rec.readyStockActive} pcs)`,
          detail: `মোট বিক্রি ${rec.totalSoldPcs} pcs বাদ দিয়ে বর্তমান রেডি স্টক ${rec.readyStockActive} pcs।`
        });
      }

      for (const sz of ['38', '42', '43']) {
        const b = rec.bySize[sz];
        if (b && (b.readyStock < 0 || b.withKarigar < 0)) {
          errorCount++;
          checks.push({
            status: 'ALERT',
            title: `সাইজ ${sz} স্টক গরমিল সতর্কতা`,
            detail: `সাইজ ${sz}: কাটিং ${b.cutRet} · সেলাই দেওয়া ${b.sewIss} · সেলাই রেডি ${b.sewRet} · বিক্রি ${b.sold} · রেডি স্টক ${b.readyStock}।`
          });
        }
      }

      if (state.khataAuditBaseline.lastUploadedAudit) {
        const up = state.khataAuditBaseline.lastUploadedAudit;
        checks.unshift({
          status: up.diffFound ? 'ALERT' : 'OK',
          title: `আপলোড করা খাতাবুক রিপোর্ট অডিট (${up.fileName})`,
          detail: up.summary
        });
        if (up.diffFound) errorCount++;
      }

      return { checks, errorCount };
    }

    async function handleKhataBookFile(file) {
      if (!file) return;
      toast('খাতাবুক ফাইল পড়া হচ্ছে...');
      let extractedText = '';
      try {
        if (file.name.toLowerCase().endsWith('.pdf') && typeof pdfjsLib !== 'undefined') {
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          const buf = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const tc = await page.getTextContent();
            extractedText += tc.items.map(it => it.str).join(' ') + '\n';
          }
        } else {
          extractedText = await file.text();
        }
        analyzeKhataBookText(extractedText, file.name);
      } catch (err) {
        toast('ফাইল পড়তে সমস্যা হয়েছে: ' + err.message);
      }
    }

    function analyzeKhataBookText(text, sourceName = 'Pasted KhataBook Data') {
      const clean = String(text || '').replace(/\s+/g, ' ');
      if (clean.length < 15) {
        toast('ফাইলে কোনো লেখা পাওয়া যায়নি।');
        return;
      }
      const findings = [];
      let diffFound = false;

      const gayatri = mahajanStats('MAH_GAYATRI');
      if (/gayatri/i.test(clean)) {
        const nums = [...clean.matchAll(/₹?\s*([0-9]{1,3}(?:,[0-9]{2,3})*(?:\.[0-9]{1,2})?)/g)]
          .map(m => parseFloat(m[1].replace(/,/g, '')))
          .filter(n => !isNaN(n) && n > 500);
        const matchedDue = nums.find(n => Math.abs(n - gayatri.netDue) < 10);
        if (matchedDue !== undefined) {
          findings.push(`গায়ত্রী টেক্সটাইল বকেয়া ₹${matchedDue} অ্যাপের (${money(gayatri.netDue)}) সাথে মিলেছে।`);
        } else if (nums.length) {
          diffFound = true;
          findings.push(`খাতাবুক ফাইলে গায়ত্রী টেক্সটাইলের অঙ্ক (${nums.slice(0,4).map(money).join(', ')}) অ্যাপের বকেয়া (${money(gayatri.netDue)}) থেকে আলাদা — যাচাই করুন।`);
        }
      }

      for (const k of state.karigars) {
        const shortName = k.name.split('(')[0].trim();
        const re = new RegExp(shortName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
        if (re.test(clean)) {
          const st = karigarStats(k.id);
          findings.push(`${shortName} পাওয়া গেছে (অ্যাপের নিট ব্যালেন্স: ${money(st.netBalance)})।`);
        }
      }

      const saleMatch = clean.match(/Total Sale Amount:\s*₹?\s*([0-9,]+\.?[0-9]*)/i);
      if (saleMatch) {
        const kbSale = parseFloat(saleMatch[1].replace(/,/g, ''));
        findings.push(`খাতাবুক সেলস রিপোর্ট মোট বিক্রি: ${money(kbSale)}।`);
      }

      const recMatch = clean.match(/(?:You'll Get|পাবেন|Receivable)[^\d]{0,20}₹?\s*([0-9,]+\.[0-9]{2})/i);
      if (recMatch) {
        const kbRec = parseFloat(recMatch[1].replace(/,/g, ''));
        const baseRec = state.khataAuditBaseline.customerReceivable;
        if (Math.abs(kbRec - baseRec) > 1) {
          diffFound = true;
          findings.push(`কাস্টমার পাওনা পরিবর্তন হয়েছে: নতুন খাতাবুক ${money(kbRec)} বনাম বর্তমান অ্যাপ ${money(baseRec)} (পার্থক্য ${money(kbRec - baseRec)})।`);
        } else {
          findings.push(`কাস্টমার মোট পাওনা ${money(kbRec)} একদম ঠিক আছে।`);
        }
      }

      if (findings.length === 0) {
        findings.push(`ফাইলটি পড়া হয়েছে (${clean.length} অক্ষর)। এতে সরাসরি কোনো অমিল ধরা পড়েনি, তবে নিচের ব্যালেন্স টেবিল মিলিয়ে নিন।`);
      }

      state.khataAuditBaseline.lastUploadedAudit = {
        fileName: sourceName,
        checkedAt: new Date().toLocaleString('en-IN'),
        diffFound,
        summary: findings.join(' ')
      };
      saveState();
      render();
      toast('খাতাবুক অডিট সম্পন্ন হয়েছে!');
    }

    function getCloudCfg() {
      try { return JSON.parse(localStorage.getItem(CLOUD_KEY) || '{}'); } catch (e) { return {}; }
    }
    function cloudUrl(cfg) {
      const base = String(cfg.url || '').trim().replace(/\/+$/, '');
      const pin = String(cfg.pin || '').trim().replace(/[.$#\[\]\/\s]+/g, '_') || 'default';
      return `${base}/tanisha_dresses/${encodeURIComponent(pin)}/factory_audit_data.json`;
    }
    function setBadge(txt) {
      const el = document.getElementById('syncBadge');
      if (el) el.textContent = txt;
    }
    function scheduleCloudSync() {
      const cfg = getCloudCfg();
      if (!cfg.url || !cfg.pin) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => syncWithFirebase(true), 1200);
    }
    async function syncWithFirebase(silent = false) {
      const cfg = getCloudCfg();
      if (!cfg.url || !cfg.pin) {
        setBadge('● অফলাইন সেভ');
        if (!silent) toast('প্রথমে Firebase URL এবং Sync PIN সেভ করুন।');
        return;
      }
      if (!navigator.onLine) {
        setBadge('● অফলাইন (অপেক্ষমাণ)');
        return;
      }
      setBadge('↻ সিঙ্ক হচ্ছে...');
      try {
        const ep = cloudUrl(cfg);
        const res = await fetch(ep + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const remote = await res.json();
        if (remote && remote.data && remote.updatedAt) {
          const rTime = Date.parse(remote.updatedAt) || 0;
          const lTime = Date.parse(state.meta?.updatedAt) || 0;
          if (rTime > lTime + 1500) {
            state = { ...JSON.parse(JSON.stringify(INITIAL_DATA)), ...remote.data };
            applyOpeningZeroMigration(state);
            saveState(true);
            render();
          }
        }
        const put = await fetch(ep, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: state, updatedAt: state.meta.updatedAt })
        });
        if (!put.ok) throw new Error('Save HTTP ' + put.status);
        setBadge('● সিঙ্ক চালু আছে');
        if (!silent) toast('সব ফোনের সাথে ডেটা সিঙ্ক হয়েছে!');
      } catch (e) {
        setBadge('● অফলাইন সেভ');
        if (!silent) toast('সিঙ্ক এরর: ' + e.message);
      }
    }
